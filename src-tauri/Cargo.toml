[package]
name = "polimath-file-copy"
version = "0.1.0"
description = "Free, open-source copy/move utility that is careful with synced and remote folders"
authors = ["Stephen Haptonstahl"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "polimath_file_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
filetime = "0.2"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
