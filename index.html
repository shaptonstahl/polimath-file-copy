<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polimath File Copy</title>
    <link rel="icon" type="image/png" href="/src/brand/polimath_icon_64.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="brand-bar">
        <img src="/src/brand/polimath_icon_64.png" alt="" />
        <h1><span class="mark">Polimath</span> File Copy</h1>
        <div class="env-line" id="env-line"></div>
      </header>
      <ul class="warnings env" id="env-notes" hidden></ul>
      <section class="panels">
        <div class="panel" id="source-panel">
          <header>
            <h2>Sources</h2>
            <span class="count" id="source-count"></span>
            <div class="spacer"></div>
            <button id="add-files">Add files…</button>
            <button id="add-folders">Add folders…</button>
            <button id="clear-sources" class="ghost">Clear</button>
          </header>
          <ul class="drop list" id="source-list" data-empty="Drop files and folders here"></ul>
        </div>

        <div class="panel" id="target-panel">
          <header>
            <h2>Target folder</h2>
            <div class="spacer"></div>
            <button id="choose-target">Choose…</button>
          </header>
          <div class="drop target" id="target-box" data-empty="Drop a folder here"></div>
        </div>
      </section>

      <section class="options">
        <label>Operation
          <select id="operation">
            <option value="copy">Copy</option>
            <option value="move">Move</option>
          </select>
        </label>
        <label>If the file exists
          <select id="rule">
            <option value="never">Skip it</option>
            <option value="replace_older" selected>Replace older</option>
            <option value="replace_newer">Replace newer</option>
            <option value="replace_smaller">Replace smaller</option>
            <option value="replace_larger">Replace larger</option>
            <option value="replace_different">Replace if different</option>
            <option value="always">Always replace</option>
          </select>
        </label>
        <label title="Times closer than this count as equal. Network shares and cloud drives often round timestamps.">Time tolerance (s)
          <input id="tolerance" type="number" min="0" step="1" value="2" />
        </label>
        <label title="Copying a cloud-only placeholder downloads it first.">
          <span><input id="skip-cloud" type="checkbox" checked /> Skip cloud-only sources</span>
        </label>
        <label>Engine
          <select id="engine">
            <option value="native">Built-in</option>
            <option value="rclone" disabled>rclone (not found)</option>
          </select>
        </label>
        <label title="Several transfers at once hide network latency.">Parallel
          <input id="parallel" type="number" min="1" max="32" value="4" />
        </label>
        <label title="Write a log of every file, its decision and its result, for both Preview and Run.">
          <span><input id="log" type="checkbox" /> Write log</span>
        </label>
        <div class="spacer"></div>
        <button id="open-settings" class="ghost" title="Settings">⚙ Settings</button>
        <button id="preview" class="primary">Preview</button>
        <button id="run" class="primary" disabled>Run</button>
        <button id="cancel" class="ghost" hidden>Cancel</button>
      </section>

      <section class="warnings-wrap" id="warnings-wrap" hidden>
        <ul class="warnings" id="warnings"></ul>
        <label class="ack" id="ack-wrap" hidden>
          <input type="checkbox" id="ack" /> I understand the warnings marked ⛔ and want to run anyway
        </label>
      </section>

      <section class="results">
        <div class="summary" id="summary"></div>
        <progress id="progress" hidden></progress>
        <ul class="errors" id="errors"></ul>
        <div class="table-wrap">
          <table id="plan-table" hidden>
            <thead>
              <tr>
                <th>Action</th>
                <th>File</th>
                <th class="num">Source size</th>
                <th>Source modified</th>
                <th class="num">Target size</th>
                <th>Target modified</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>
        <h3>Logs</h3>
        <p class="muted">Each Preview and Run writes its own log when <b>Write log</b> is ticked.</p>
        <label class="stack">Log folder
          <input id="log-dir" type="text" readonly />
        </label>
        <p class="muted" id="log-dir-default"></p>
        <div class="row">
          <button type="button" id="choose-log-dir">Choose folder…</button>
          <button type="button" id="reset-log-dir" class="ghost">Use default</button>
          <button type="button" id="open-log-dir" class="ghost">Open folder</button>
        </div>
        <p class="error-text" id="settings-error"></p>
        <div class="row end">
          <button value="close" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <dialog id="outcome-dialog">
      <form method="dialog">
        <h2 id="outcome-title"></h2>
        <p id="outcome-message"></p>
        <ul class="outcome-counts" id="outcome-counts"></ul>
        <div id="outcome-log" hidden>
          <p class="muted">Log written to:</p>
          <p><a href="#" id="outcome-log-link" class="path"></a></p>
          <div class="row">
            <button type="button" id="outcome-open-log">Open log</button>
            <button type="button" id="outcome-reveal-log" class="ghost">Show in folder</button>
          </div>
        </div>
        <p class="error-text" id="outcome-log-error"></p>
        <div class="row end">
          <button value="close" class="primary" autofocus>OK</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
